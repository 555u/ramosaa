  --ink: #211622;
  --night: #281b2a;

  --panel-light: #39283a;
  --line: #594252;
  --ivory: #fbefd9;
  --body: #e6d4cc;
  --muted: #cbb2b9;
  --rose: #edb9c3;
  --gold: #e1bf8a;
  --paper: #f4e6d2;
  --paper-ink: #422b3b;
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html { background: #171019; }
body { margin: 0; color: var(--ivory); font-family: var(--sans); font-size: 15px; line-height: 1.55; background: radial-gradient(ellipse at 50% 12%, #483047 0, #241926 42%, #171019 88%); }
button, input, textarea, select { font: inherit; }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button { color: inherit; cursor: pointer; }
a { color: inherit; }
img { display: block; width: 100%; height: auto; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; line-height: 1.08; text-wrap: balance; }
h1 { font-size: clamp(34px, 9.4vw, 47px); letter-spacing: -.042em; }
h2 { font-size: 30px; letter-spacing: -.027em; }
h3 { font-size: 23px; letter-spacing: -.018em; }
p { color: var(--body); }
small { font-size: 12px; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.skip-link { position: fixed; top: 5px; left: 5px; transform: translateY(-150%); background: var(--ivory); color: var(--ink); z-index: 10; padding: 10px; }
.skip-link:focus { transform: translateY(0); }
.studio-shell { width: min(100%, 430px); min-height: 100dvh; margin: auto; position: relative; display: flex; flex-direction: column; background: var(--night); box-shadow: 0 0 100px #100a12a6; }
.studio-shell::before { content: ""; pointer-events: none; position: absolute; inset: 0; z-index: 1; opacity: .19; background: url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.25' filter='url(%23n)'/%3E%3C/svg%3E"); mix-blend-mode: soft-light; }
.masthead { min-height: 62px; padding: env(safe-area-inset-top, 0px) 19px 0; display: flex; align-items: center; justify-content: space-between; background: #251926; border-bottom: 1px solid #5d4455; flex: 0 0 auto; }
.brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; font-family: var(--serif); font-size: 21px; letter-spacing: -.035em; min-height: 46px; white-space: nowrap; }
.brand-mark { width: 29px; height: 29px; color: var(--gold); }
.brand-mark svg { width: 100%; height: 100%; }
.header-link { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; color: var(--muted); font-size: 11px; letter-spacing: .045em; text-decoration: none; }
.icon { width: 19px; height: 19px; display: inline-block; vertical-align: middle; flex: 0 0 auto; stroke-width: 1.55; }
#main { flex: 1; min-width: 0; outline: none; }
.bottom-nav { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); min-height: calc(66px + var(--safe-bottom)); padding: 4px 9px calc(4px + var(--safe-bottom)); background: #221722f7; border-top: 1px solid #604958; backdrop-filter: blur(16px); }
.bottom-nav a { display: grid; justify-items: center; align-content: center; gap: 3px; position: relative; color: var(--muted); text-decoration: none; font-size: 10px; font-weight: 600; letter-spacing: .035em; min-height: 54px; border-radius: 5px; }
.bottom-nav a[aria-current="page"] { color: var(--gold); background: #3e2a3b80; }
.bottom-nav a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 39%; right: 39%; height: 1px; background: var(--gold); }
.hero { isolation: isolate; position: relative; min-height: clamp(492px, calc(100svh - 160px), 680px); display: flex; align-items: end; overflow: hidden; border-bottom: 1px solid #8f6d5e; background: #2c1d31; }
.hero-art, .hero::after { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.hero-art { object-fit: cover; object-position: center 43%; }
.hero::after { content: ""; background: linear-gradient(0deg, #211522 3%, #211522c7 22%, #21152212 76%), linear-gradient(90deg, #221423b5, #22142337 70%, transparent); }
.hero-frame { position: absolute; inset: 11px; border: 1px solid #e4bd875c; border-bottom: none; pointer-events: none; }
.hero-frame::before, .hero-frame::after { content: "✦"; position: absolute; top: -8px; color: #e1bf8aa6; font-size: 12px; }
.hero-frame::before { left: -4px; } .hero-frame::after { right: -4px; }
.hero-content { width: 100%; padding: 36px clamp(23px, 7vw, 34px) 27px; }
.hero h1 { font-size: clamp(44px, 12.1vw, 61px); max-width: 330px; line-height: .99; text-wrap: initial; text-shadow: 0 2px 24px #1b101b; }
.hero .intro { margin: 13px 0 22px; max-width: 254px; font-family: var(--serif); font-style: italic; font-size: 17px; color: #fae8d9; line-height: 1.36; text-shadow: 0 2px 10px #1b101b; }
.kicker { color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; line-height: 1.4; }
.hero .kicker { display: flex; align-items: center; gap: 9px; margin-bottom: 13px; }
.hero .kicker::before { content: ""; width: 20px; height: 1px; background: var(--gold); }
.actions { display: grid; gap: 8px; }
.hero .actions { max-width: 310px; }
.button { display: inline-flex; min-height: 47px; align-items: center; justify-content: center; gap: 9px; padding: 9px 13px; border: 1px solid #86667d; border-radius: 5px; background: #352437; text-align: center; text-decoration: none; color: var(--ivory); font-size: 13px; font-weight: 650; line-height: 1.25; }
.button.primary { color: #33212c; border-color: #f1d4a5; background: #edcc9a; box-shadow: inset 0 0 0 2px #cfab7652, 0 4px 14px #1a0b1640; }
.button.ghost { background: #2e2030bd; border-color: #a47f84; }
.button:hover { filter: brightness(1.12); }
.button:disabled { opacity: .47; cursor: default; }
.hero .button { justify-content: space-between; padding-inline: 14px; }
.text-link { display: inline-flex; min-height: 44px; align-items: center; gap: 7px; color: var(--rose); text-underline-offset: 4px; font-size: 13px; font-weight: 600; }
button.text-link { background: none; padding: 0; border: 0; text-decoration: underline; }
.hero .text-link { min-height: 44px; margin-top: 4px; }
.section { padding: 25px 20px 33px; }
.section-head { display: grid; gap: 9px; margin-bottom: 20px; }
.section-head p:not(.kicker) { font-size: 14px; }
.home-desk { background: #302132; }
.home-desk .section-head { gap: 7px; margin-bottom: 15px; }
.desk-links { display: grid; gap: 8px; }
.desk-link { display: grid; grid-template-columns: 39px 1fr 19px; gap: 10px; align-items: center; text-decoration: none; padding: 11px; min-height: 67px; border: 1px solid var(--line); border-radius: 5px; background: #382738; }
.desk-link strong, .desk-link small { display: block; }
.desk-link strong { font-family: var(--serif); font-size: 19px; font-weight: 400; line-height: 1.15; }
.desk-link small { color: var(--muted); margin-top: 3px; }
.desk-glyph { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 50%; background: #4d3548; color: var(--gold); }
.desk-link > .icon { color: var(--gold); width: 15px; }
.signoff { margin-top: 20px; color: var(--muted); font-family: var(--serif); font-size: 16px; font-style: italic; text-align: center; }
.panel, .paper { border: 1px solid var(--line); border-radius: 6px; padding: 15px; background: var(--panel); }
.paper { background: var(--paper); color: var(--paper-ink); border-color: #e5c7ab; }
.paper p, .paper .kicker { color: var(--paper-ink); }
.paper .kicker { color: #78495f; }
.panel p, .paper p { font-size: 14px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.row .button { flex: 1; }
.progress-label { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
.progress { width: 100%; height: 4px; margin-top: 8px; background: #4d3549; border-radius: 4px; overflow: hidden; }
.progress span { height: 100%; display: block; background: var(--gold); transition: width .25s ease; }
.meter { margin-bottom: 17px; }
.art-frame { display: block; position: relative; padding: 5px; border: 1px solid #ab826a; background: #3e2c3a; box-shadow: 0 8px 21px #170d1890; touch-action: pan-y; }
.art-frame img { aspect-ratio: 1; object-fit: cover; }
.art-frame .favorite { position: absolute; right: 13px; top: 13px; }
.icon-button { display: inline-grid; place-items: center; width: 45px; min-height: 45px; border: 1px solid #8a6a81; border-radius: 5px; background: #302131; color: var(--gold); }
.favorite { border-radius: 50%; background: #291b2be8; color: var(--ivory); }
.favorite[aria-pressed="true"] { color: var(--rose); }
.favorite[aria-pressed="true"] .icon { fill: var(--rose); }
.reactions, .two-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.reactions .button { font-size: 12px; padding-inline: 3px; }
.reactions .icon { width: 15px; }
.two-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
[aria-pressed="true"].button, .answer[aria-pressed="true"] { background: #54384d; border-color: var(--gold); }
.detail { animation: reveal .32s ease both; }
@keyframes reveal { from { opacity: .45; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.detail h2, .result-card h2 { margin: 4px 0 7px; }
.detail p { line-height: 1.43; }
.art-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.art-tools .text-link { color: #6c3d56; }
.gallery-guide { text-align: center; color: var(--muted); font-size: 12px; }
.choice-card { display: grid; gap: 7px; text-align: left; padding: 6px 6px 10px; }
.choice-card img { aspect-ratio: 1.1; object-fit: cover; }
.collection { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.art-tile { min-width: 0; display: grid; gap: 6px; text-decoration: none; padding: 5px 5px 8px; border: 1px solid #7b586e; background: #3a2939; border-radius: 5px; }
.art-tile img { aspect-ratio: 1; object-fit: cover; }
.art-tile span { font-size: 12px; padding-inline: 4px; }
.result-card { display: grid; gap: 7px; }
.result-card .art-frame { margin-bottom: 4px; }
.exercise { padding-top: 8px; border-top: 1px solid #a480834f; }
.question { margin: 0 0 12px; }
.answer { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; min-height: 54px; padding: 9px 10px; color: var(--ivory); text-align: left; border: 1px solid #75566c; border-radius: 5px; background: var(--panel); }
.answer .radio { width: 17px; height: 17px; border: 1px solid #b392a3; border-radius: 50%; }
.answer[aria-pressed="true"] .radio { background: var(--gold); box-shadow: inset 0 0 0 3px #54384d; }
.answer span:nth-child(2) { font-size: 14px; line-height: 1.35; }
.swatch { display: block; width: 44px; height: 31px; border-radius: 3px; border: 1px solid #f1c5bf8c; }
.wash { background: radial-gradient(ellipse at 37% 50%, #b35a78 4%, #cf9ab3 31%, #eedbe1 60%, #f5e8d4 85%); }
.matte { background: #b75d76; }
.texture { background: repeating-linear-gradient(155deg, #8c3655 0, #cc7a8d 4px, #eab0a5 6px, #9e4363 10px); }
.wash-art { height: 137px; border-radius: 5px; width: 100%; background: #f6e7d2; }
.wash-controls { display: grid; gap: 8px; margin-top: 10px; }
input[type="range"] { width: 100%; height: 44px; accent-color: var(--gold); margin: 0; }
.field { display: grid; gap: 5px; }
.field label { font-size: 13px; color: var(--body); font-weight: 650; }
select, textarea, input[type="text"] { width: 100%; border: 1px solid #876881; color: var(--ivory); border-radius: 5px; background: #271b29; padding: 10px 11px; font-size: 16px; }
select, input[type="text"] { min-height: 46px; }
textarea { min-height: 86px; resize: vertical; }
.color-pick { display: grid; grid-template-columns: 42px 1fr 22px; text-align: left; align-items: center; gap: 9px; padding: 6px; width: 100%; min-height: 59px; background: #3c2a3c; border: 1px solid var(--line); border-radius: 5px; }
.color-pick[aria-pressed="true"] { border-color: var(--gold); }
.color-pick span:not(.swatch) { font-size: 13px; }
.color-pick small { display: block; color: var(--muted); font-size: 11px; }
.saved-palette { display: flex; gap: 5px; margin-block: 8px; }
.saved-palette .swatch { flex: 1; }
.empty { padding: 17px; border: 1px dashed #806476; border-radius: 5px; color: var(--muted); font-size: 13px; }
.feedback { margin-top: 8px; }
.status { color: var(--gold); min-height: 1.5em; font-size: 12px; }
.note { white-space: pre-wrap; overflow-wrap: anywhere; }
@media (min-width: 540px) {
  .studio-shell { border-inline: 1px solid #694b60; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
.comparison-image { overflow: hidden; display: block; }
.comparison-image img { display: block; }
.comparison-image .soft-edge { filter: blur(2.8px); transform: scale(1.05); }
.comparison-image .crisp-edge { transform: scale(1.05); }
.comparison-image .gentle-color { filter: saturate(.58) contrast(.79) brightness(1.14); }
.comparison-image .dramatic-color { filter: saturate(1.43) contrast(1.22); }
.palette-point { position: absolute; display: grid; place-items: center; transform: translate(-50%,-50%); min-width: 45px; min-height: 45px; background: none; border: 0; border-radius: 50%; padding: 0; }
.palette-point span { display: grid; place-items: center; width: 23px; height: 23px; border: 2px solid #f9e9d5; border-radius: 50%; background: var(--sample); color: white; box-shadow: 0 1px 5px #211622, 0 0 0 3px #39263a85; }
.palette-point[aria-pressed="true"] span { background: #3d2b3f; box-shadow: 0 0 0 3px #d7b482b0; }
.palette-point .icon { width: 14px; stroke-width: 2.3; }

.painting-tips summary { min-height: 44px; cursor: pointer; align-content: center; }
.painting-tips details p { margin: 3px 0 8px; }

</style>
</head>

function paintingResults(reactions, choices) {
  const weights = {love:5, curious:2, skip:-3};
  return paintings.map((art, index) => {
    const hits = art.traits.map((trait, i) => choices[i] === trait);
    const evidence = hits.flatMap((hit, i) => hit ? [comparisons[i].options[choices[i]].toLowerCase()] : []);
    const score = (weights[reactions[art.id]] ?? 0) + evidence.length;
    return {art, score, index, evidence, reaction:reactions[art.id]};
  }).sort((a,b) => b.score - a.score || a.index - b.index).slice(0, 2);
}

function quizResults(answers) {
  const keys = Object.keys(paints);
  const scores = keys.map((id, i) => ({id, i, look:0, setup:0}));
  answers.forEach((answer, q) => {
    const option = questions[q]?.options[answer];
    if (!option) return;
    scores.forEach((score, i) => {
      score.look += option.look[i] ?? 0;
      score.setup += option.setup[i] ?? 0;
    });
  });
  const ranked = key => [...scores].sort((a,b) => b[key] - a[key] || a.i - b.i);
  const look = ranked('look');
  const setup = ranked('setup');
  return {
    look:look[0].id, easy:setup[0].id,
    lookNear:look[0].look - look[1].look <= 2 ? look[1].id : null,
    setupNear:setup[0].setup - setup[1].setup <= 2 ? setup[1].id : null,
    scores
  };
}

function setupReason(id, answers) {
  const workspace = ['small desk', 'shared table', 'dedicated painting space'][answers[4]];
  const session = ['short sessions', 'sessions you can pack away after', 'time to revisit a painting'][answers[3]];
  const method = {
    acrylic:'quick-drying layers and water cleanup while the paint is wet',
    watercolor:'a compact setup with paper, one brush, and a water jar',
    gouache:'opaque layers with a compact, water-based setup',
    oils:'more time to blend, with a place to leave the board while it dries'
  }[id];
  return `You chose ${session} and a ${workspace}. ${paints[id].name} offers ${method}.`;
}

    <div class="field"><label for="date-time">Time I have</label><select name="minutes" id="date-time">${[10,15,20,30,45].map(n=>`<option value="${n}" ${n===(plan?.minutes??20)?'selected':''}>${n} minutes</option>`).join('')}</select></div>
    <div class="field"><label for="date-mood">What I’m in the mood for</label><select name="mood" id="date-mood">${Object.keys(moods).map(mood=>`<option value="${mood}" ${mood===(plan?.mood??'bold')?'selected':''}>${mood[0].toUpperCase()+mood.slice(1)}</option>`).join('')}</select></div>
    <div class="field"><label for="date-medium">Paint I have</label><select name="medium" id="date-medium">${mediumOptions(plan?.medium ?? currentQuiz()?.easy ?? 'gouache')}</select></div>
    <div class="field"><label for="date-colors">Colors I have</label><select name="colors" id="date-colors">${[1,2,3].map(n=>`<option value="${n}" ${n===(plan?.colors??3)?'selected':''}>${n} ${n===1?'color':'colors'}</option>`).join('')}</select></div>
    <button class="button primary" type="submit">Make my painting date</button></form>
    ${plan ? `<article class="paper feedback stack" role="status"><p class="kicker">Your painting date</p><h3>${plan.minutes} minutes · ${paints[plan.medium].name} · ${plan.colors} ${plan.colors===1?'color':'colors'} · ${moods[plan.mood].subject}</h3><p>${plan.colors===1?'Use the bare surface as your lightest value and vary how much paint you put down. ':''}${plan.colors===1&&plan.mood==='curious'?'Divide the pear into a light shape, a middle shape, and a shadow.':moods[plan.mood].instruction}</p><p>${dateTechnique[plan.medium]}</p><p>Set up for 3 minutes, paint for ${plan.minutes-5}, and take 2 minutes to notice what you’d do again.</p></article>` : ''}${back('studio')}</section>`;
}
function notebook() {
  const favoriteArt = paintings.filter(art=>state.favorites.includes(art.id));
  const taste = currentTaste();
  const result = currentQuiz();
  return `<section class="section">${head('Your work, kept close','Studio notebook','A place to keep what you loved and what you tried. Your notebook stays on this device.')}
    <div class="stack"><article class="panel stack"><h3>My results</h3>${taste ? link(taste.map(x=>x.art.name).join(' + '),'taste-result','button') : link('Find my painting style','gallery','button')}${result ? link(`Paint quiz · ${paints[result.easy].name} to start`,'quiz-result','button') : link('Find my first medium','quiz','button')}</article>
    <article class="panel stack"><h3>Favorite paintings</h3>${favoriteArt.length ? tiles(favoriteArt) : '<p class="empty">Tap a heart in the gallery to keep a painting here.</p>'}</article>
    <article class="panel stack"><h3>Saved palettes</h3>${state.palettes.length ? state.palettes.map(entry=>{ const art=artById(entry.id);return `<div class="panel"><p>${art.name}</p><div class="saved-palette">${entry.colors.map(i=>`<span class="swatch" style="background:${art.colors[i]}" role="img" aria-label="${colorNames[i]}"></span>`).join('')}</div>${link('Open mixing notes',`palettes/${art.id}`,'text-link')}</div>`;}).join('') : '<p class="empty">Your colors will appear here when you save a palette.</p>'}</article>
    <article class="panel stack"><h3>After a painting</h3><form id="note-form" class="stack"><div class="field"><label for="studio-note">What did you enjoy enough to do again?</label><textarea id="studio-note" name="note" maxlength="600" required placeholder="One little thing you noticed…"></textarea></div><button class="button primary" type="submit">Save this note</button></form>
    ${state.notes.map(entry=>`<div class="paper"><p class="kicker">${esc(new Intl.DateTimeFormat('en',{month:'short',day:'numeric',year:'numeric'}).format(entry.date))}</p><p class="note">${esc(entry.text)}</p></div>`).join('')}</article>
    ${storageOkay?'':'<p class="status" role="status">This browser couldn’t save studio data. Keep this tab open to keep your current work.</p>'}
    ${back('studio')}</div></section>`;
}

const offlineTips = [
  ['What should I paint first?','Paint one flower from the side. Use a light, a middle value, and a shadow. Make the whole thing the size of your thumb.'],
  ['Why do my colors look muddy?','Clean your brush, pick just two colors, and mix a fresh puddle beside the muddy one. Compare them before you add anything else.'],
  ['Help me mix a shadow','Start with your petal color. Mix a little blue into a separate dab and test that beside your lit color. Adjust a tiny bit at a time.'],
  ['I hate how my painting looks right now','Put the painting down, take three steps back, and squint. Pick one shape that’s hard to read. Fix that shape and see what changes.']
];
function chatPage() {
  return `<section class="section">${head('From the studio','Ask Rashed','Open a question for a quick painting tip. Live AI chat needs the separately hosted backend.')}
    <div class="panel stack painting-tips">${offlineTips.map(([question,tip])=>`<details><summary>${question}</summary><p>${tip}</p></details>`).join('')}</div>
    ${back('studio')}</section>`;
}

const routes = {
  studio:home, gallery, compare, 'taste-result':tasteResult, collection, art:artPage,
  quiz, 'quiz-result':quizResult, wash:washLesson, palettes:palette, try:tryThree,
  date:paintDate, notebook, chat:chatPage
};
const galleryPages = ['gallery','compare','taste-result','collection','art','palettes'];
const quizPages = ['quiz','quiz-result','wash'];
function activeTab() {
  if (galleryPages.includes(page)) return 'gallery';
  if (quizPages.includes(page)) return 'quiz';
  return page === 'chat' ? 'chat' : 'studio';
}
function render({reset=false, focus, id}={}) {
  const routeId = id ?? location.hash.slice(1).split('/')[1];
  main.innerHTML = routes[page](routeId);
  nav.innerHTML = [['studio','Studio'],['gallery','Gallery'],['quiz','Quiz'],['chat','Ask Rashed']].map(([route,label])=>`<a href="#${route}" ${activeTab()===route?'aria-current="page"':''}>${icon(route)}<span>${label}</span></a>`).join('');
  syncWash();
  if (reset) window.scrollTo(0,0);
  if (focus) {
    const target = main.querySelector(focus) ?? main;
    if (/^H[1-6]$/.test(target.tagName)) target.tabIndex = -1;
    target.focus({preventScroll:true});
    if (!reset && /^H[1-6]$/.test(target.tagName)) target.scrollIntoView({block:'nearest'});
  }
}
function onRoute() {
  const [name,id] = location.hash.slice(1).split('/');
  if (name==='main') {main.focus();return;}
  const oldPage = page;
  page = Object.hasOwn(routes,name) ? name : 'studio';
  if (page==='palettes') {
    const next = artById(id || paletteArt).id;
    if (oldPage!==page || next!==paletteArt) paletteColors = state.palettes.find(item=>item.id===next)?.colors.slice() ?? [];
    paletteArt = next;
  }
  render({reset:true,focus:oldPage ? 'h1' : undefined,id});
}
function changeAndRender(selector) {
  save();
  render({focus:selector});
}
function advanceArtwork(delta) {
  const next = Math.max(0,Math.min(paintings.length-1,state.galleryAt+delta));
  if (next===state.galleryAt) return;
  state.galleryAt = next;
  changeAndRender('.art-frame .favorite');
}
function stepQuiz(delta) {
  state.quizAt = Math.max(0,Math.min(questions.length-1,state.quizAt+delta));
  changeAndRender('.question');
}
function goTo(name) {
  location.hash = name;
}
main.addEventListener('click', event=>{
  const control = event.target.closest('[data-action]');
  if (!control || control.disabled) return;
  const {action,value,id} = control.dataset;
  const i = Number(value);
  switch (action) {
    case 'favorite': {
      const wasSaved = state.favorites.includes(id);
      state.favorites = wasSaved ? state.favorites.filter(art=>art!==id) : [...state.favorites,id];
      save();
      control.setAttribute('aria-pressed',String(!wasSaved));
      break;
    }
    case 'react':
      state.reactions[paintings[state.galleryAt].id] = value;
      changeAndRender(`[data-action="react"][data-value="${value}"]`);
      break;
    case 'art-next': advanceArtwork(1); break;
    case 'art-prev': advanceArtwork(-1); break;
    case 'compare-pick':
      state.choices[state.comparisonAt] = i;
      changeAndRender(`[data-action="compare-pick"][data-value="${i}"]`);
      break;
    case 'compare-back':
      if (state.comparisonAt===0) goTo('gallery');
      else {state.comparisonAt--;changeAndRender('h2');}
      break;
    case 'compare-next':
      if (state.comparisonAt===comparisons.length-1) {
        state.galleryDone = true; save(); goTo('taste-result');
      } else {state.comparisonAt++;changeAndRender('h2');}
      break;
    case 'answer':
      state.answers[state.quizAt] = i;
      changeAndRender(`[data-action="answer"][data-value="${i}"]`);
      break;
    case 'quiz-back': stepQuiz(-1); break;
    case 'quiz-next':
      if (state.quizAt===questions.length-1) {
        state.quizDone = true; save(); goTo('quiz-result');
      } else stepQuiz(1);
      break;
    case 'water-down':
    case 'water-up':
      state.wash = Math.min(100,Math.max(0,state.wash+(action==='water-up'?10:-10)));
      save(); syncWash();
      break;
    case 'color':
      paletteColors = paletteColors.includes(i) ? paletteColors.filter(color=>color!==i) : [...paletteColors,i];
      render({focus:`${control.classList.contains('palette-point')?'.palette-point':'.color-pick'}[data-value="${i}"]`});
      break;
    case 'save-palette':
      state.palettes = [...state.palettes.filter(entry=>entry.id!==paletteArt),{id:paletteArt,colors:[...paletteColors]}];
      save();
      document.querySelector('#palette-status').textContent = storageOkay?'Palette saved in your notebook.':'This browser couldn’t save the palette.';
      break;
    case 'pear-pick':
      state.pearMedium = document.querySelector('#pear-medium').value;
      state.pearPick = i;
      changeAndRender(`[data-action="pear-pick"][data-value="${i}"]`);
      break;
  }
});
main.addEventListener('change',event=>{
  const input = event.target;
  if (input.id==='palette-art') goTo(`palettes/${input.value}`);
  if (input.id==='pear-medium') {
    state.pearMedium = input.value;
    state.pearPick = null;
    changeAndRender('#pear-medium');
  }
});
main.addEventListener('input',event=>{
  const input = event.target;
  if (input.id==='wash') {state.wash=Number(input.value);save();syncWash();}
});
main.addEventListener('submit',event=>{
  event.preventDefault();
  const form = event.target;
  const data = new FormData(form);
  if (form.id==='note-form') {
    const text = String(data.get('note') ?? '').trim();
    if (!text) return;
    state.notes = [{text,date:Date.now()},...state.notes];
    changeAndRender('#studio-note');
  }
  if (form.id==='date-form') {
    state.plan = {minutes:Number(data.get('minutes')),mood:data.get('mood'),medium:data.get('medium'),colors:Number(data.get('colors'))};
    changeAndRender('#date-form button');
    main.querySelector('.feedback')?.scrollIntoView({block:'nearest'});
  }
});
main.addEventListener('touchstart',event=>{
  if (!event.target.closest('[data-swipe]') || event.target.closest('button')) return;
  const t = event.changedTouches[0];
  touchStart = {x:t.clientX,y:t.clientY};
},{passive:true});
main.addEventListener('touchend',event=>{
  if (!touchStart) return;
  const t = event.changedTouches[0];
  const dx = t.clientX-touchStart.x;
  const dy = t.clientY-touchStart.y;
  touchStart = null;
  if (page==='gallery' && Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)*1.45) advanceArtwork(dx<0?1:-1);
},{passive:true});
main.addEventListener('touchcancel',()=>{touchStart=null;},{passive:true});
window.addEventListener('hashchange',onRoute);
document.querySelector('#notebook-link').innerHTML = `${icon('book')} Notebook`;
onRoute();

})();
</script>
</body>
</html>
